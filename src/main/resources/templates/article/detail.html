<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 상세</title>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <h1>게시글 상세</h1>

    <p><strong>제목 : </strong><span th:text="${article.title}"></span></p>
    <p><strong>내용 : </strong><span th:text="${article.content}"></span></p>
    <p><strong>등록 일시 : </strong><span th:text="${#temporals.format(article.createdDate, 'yyyy-MM-dd HH:mm:ss')}"></span></p>

    <div style="display: flex; gap: 8px;">
        <a th:href="@{/article/edit/{id}(id=${article.id})}"><button>수정</button></a>
        <form th:action="@{/article/delete/{id}(id=${article.id})}" method="post">
            <button type="submit">삭제</button>
        </form>
        <a href="/article/list"><button>목록</button></a>
    </div>
</body>
</html>
