<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 수정</title>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <h1>게시글 수정</h1>

    <form th:action="@{/article/edit/{id}(id=${article.id})}" method="post">
        <div>
            <label>제목</label>
            <input type="text" name="title" th:value="${article.title}" />
        </div>
        <div>
            <label>내용</label>
            <textarea name="content" th:text="${article.content}"></textarea>
        </div>
        <button type="submit">수정</button>
        <a href="/article/list"><button type="button">목록</button></a>
    </form>
</body>
</html>
